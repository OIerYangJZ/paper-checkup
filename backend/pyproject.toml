[project]
name = "paper-checkup"
version = "0.1.0"
description = "论文审稿体检：LaTeX 结构提取、阅读路径与审稿对抗"
readme = "README.md"
authors = [
    { name = "OIerYangJZ", email = "theyjz001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.58.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[project.scripts]
paper-checkup = "paper_checkup.cli:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
