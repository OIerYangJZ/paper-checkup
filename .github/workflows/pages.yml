name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          # Public HTTPS address of the analysis API (Tailscale Funnel on the Studio); repo variable API_BASE.
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npm run build
      # frontend/public/data (full reports with the papers' LaTeX sources) is gitignored, so the build has no
      # data directory; ship the public copy whose sources were removed by `paper-checkup publish`.
      - name: Bundle the public preset reports
        run: cp -R site/data frontend/dist/data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
